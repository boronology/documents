baseURL: https://www.penguinability.net/
languageCode: "ja-JP"
title: "ペンギン水槽"
theme: "hextra"
defaultContentLanguage: ja

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
enableGitInfo: true

frontmatter:
  date:
    - date
    - publishDate
  lastmod:
    - :git
    - lastmod
    - publishDate
    - date
    

menu:
  main:
    - name: Document
      identifier: documents
      pageref: /docs
      weight: 1
    - name: Blog
      identifier: blog
      pageref: /blog
      weight: 2

params:
  page:
    width: wide
  externalLinkDecoration: true
  displayUpdatedDate: true
  displayUpdatedAuthor: true
  dateFormat: "2006-01-02 15:04:05+09:00"