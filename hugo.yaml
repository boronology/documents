baseURL: https://www.penguinability.net/
title: "ペンギン水槽"
theme: "hextra"
defaultContentLanguage: ja

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
enableGitInfo: true

languages:
  ja:
    label: "日本語"
    locale: "ja-JP"

frontmatter:
  date:
    - date
    - publishDate
  lastmod:
    - :git
    - lastmod
    - publishDate
    - date

taxonomies:
  tag: tags
#  category: categories

menu:
  main:
    - name: Document
      identifier: documents
      pageref: /docs
      weight: 1
    - name: Blog
      identifier: blog
      pageref: /blog
      weight: 2

params:
  author:
    name: boronology
    email: boronology@
  # rss:
  #   sections:
  #     - 'blog'
  #     - 'docs'
  page:
    width: wide
  externalLinkDecoration: true
  displayUpdatedDate: true
  displayUpdatedAuthor: true
  dateFormat: "2006-01-02 15:04:05+09:00"
  search:
    flexsearch:
      js: "js/flexsearch.js"
  mermaid:
    js: "js/mermaid.esm.min.mjs"

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
